name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # The release variant is what ships, and it is the only one that runs R8 and the resource
      # shrinker. Without this, minification was never exercised in CI — so a missing keep rule
      # (for a kotlinx.serialization serializer, say) would only surface after upload. No keystore
      # is configured here, so this produces an unsigned APK; the point is to prove R8 and
      # resource shrinking still succeed.
      - name: Build release APK (exercises R8 and resource shrinking)
        run: ./gradlew assembleRelease

      - name: Run unit tests against the release variant
        run: ./gradlew testReleaseUnitTest

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
